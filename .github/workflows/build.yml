name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble library (release AAR)
        run: ./gradlew :ripple:assembleRelease --warning-mode all --stacktrace

      - name: Assemble demo (debug APK)
        run: ./gradlew :app:assembleDebug --warning-mode all --stacktrace

      - name: Lint library
        run: ./gradlew :ripple:lintRelease --warning-mode all --stacktrace
        continue-on-error: true

      - name: Upload release AAR
        uses: actions/upload-artifact@v4
        with:
          name: ripple-release-aar
          path: ripple/build/outputs/aar/ripple-release.aar
          if-no-files-found: error

      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: demo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
