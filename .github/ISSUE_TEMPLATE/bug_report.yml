name: Bug report
description: Report a problem with RippleEffect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: When I set `app:rb_shape="matchView"` on a CardView with elevation 4dp, …
    validations:
      required: true

  - type: input
    id: ripple-version
    attributes:
      label: RippleEffect version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / Android version
      placeholder: "Pixel 7, Android 14 (API 34)"
    validations:
      required: true

  - type: input
    id: gradle-versions
    attributes:
      label: AGP / Gradle version
      placeholder: "AGP 9.1.1, Gradle 9.3.1"
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: XML layout + Kotlin/Java code that reproduces the issue.
      render: kotlin
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Stack trace / logs
      description: Paste any relevant logcat output.
      render: shell
    validations:
      required: false
